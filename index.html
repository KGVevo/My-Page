<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#a78bfa">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="authContainer" class="auth-container">
        <h2 class="message">Nuestro rincón</h2>
        
        <input type="email" id="emailInput" class="password-input" placeholder="Email">
        
        <input type="password" id="passwordInput" class="password-input" placeholder="Contraseña">

        <p id="authMessage"></p>
        
        <button id="confirmBtn" class="confirm-button">Entrar</button>
        <button id="signupBtn" class="nav-btn" style="margin-top: 10px;">Crear cuenta</button>
        
        <button id="resetBtn" class="reset-link">¿Olvidaste tu contraseña?</button>
    </div>


    <script type="module" src="scripts.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>
</body>
</html>
