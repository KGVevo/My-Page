<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Fondo noche estrellado -->
    <radialGradient id="nightBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1445"/>
      <stop offset="100%" stop-color="#0d0a22"/>
    </radialGradient>
    
    <!-- Corazón degradado violeta-rosa -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f4a6c8"/>
    </linearGradient>
    
    <!-- Texto gradiente sutil -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ebe7ff"/>
      <stop offset="100%" stop-color="#a9a1d6"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo -->
  <rect width="512" height="512" fill="url(#nightBg)"/>
  
  <!-- Estrellas -->
  <g fill="#fff" opacity="0.9">
    <!-- Estrellas principales -->
    <circle cx="60" cy="80" r="2.5"/>
    <circle cx="452" cy="70" r="1.8"/>
    <circle cx="90" cy="200" r="2.2"/>
    <circle cx="420" cy="180" r="1.5"/>
    <circle cx="40" cy="350" r="2"/>
    <circle cx="472" cy="340" r="1.6"/>
    <circle cx="80" cy="440" r="2.5"/>
    <circle cx="430" cy="450" r="1.3"/>
    <circle cx="200" cy="100" r="1.7"/>
    <circle cx="310" cy="410" r="2"/>
    <circle cx="180" cy="300" r="1.4"/>
    <circle cx="330" cy="150" r="1.6"/>
    <circle cx="250" cy="60" r="1.3"/>
    <circle cx="260" cy="460" r="1.8"/>
    <circle cx="120" cy="430" r="1.2"/>
  </g>
  
  <!-- Estrellas doradas sutiles -->
  <g fill="#fcd98a" opacity="0.7">
    <circle cx="150" cy="120" r="1.4"/>
    <circle cx="360" cy="250" r="1.1"/>
    <circle cx="100" cy="380" r="1.3"/>
    <circle cx="410" cy="160" r="0.9"/>
    <circle cx="220" cy="220" r="1"/>
    <circle cx="290" cy="310" r="0.8"/>
  </g>
  
  <!-- Grupo centrado: J + corazón + C -->
  <g transform="translate(256, 256)">
    <!-- Letra J -->
    <text x="-110" y="18" 
          font-family="Georgia, 'Cormorant Garamond', serif" 
          font-size="140" 
          font-weight="700" 
          fill="url(#textGrad)" 
          text-anchor="end"
          dominant-baseline="middle"
          letter-spacing="0">J</text>
    
    <!-- Corazón en el medio -->
    <g transform="scale(0.75)">
      <path d="M0,30 C-30,10 -60,25 -60,55 C-60,90 0,120 0,145 C0,120 60,90 60,55 C60,25 30,10 0,30" 
            fill="url(#heartGrad)"/>
      <!-- Brillo -->
      <path d="M-22,48 C-22,48 -8,68 0,68 C0,68 8,48 8,48 C8,48 -6,40 -16,42" 
            fill="#fff" opacity="0.25"/>
    </g>
    
    <!-- Letra C -->
    <text x="110" y="18" 
          font-family="Georgia, 'Cormorant Garamond', serif" 
          font-size="140" 
          font-weight="700" 
          fill="url(#textGrad)" 
          text-anchor="start"
          dominant-baseline="middle"
          letter-spacing="0">C</text>
  </g>
</svg>