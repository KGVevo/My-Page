<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#a78bfa">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <audio loop autoplay>
        <source src="music_home.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>


    
    <div id="loadingMessage">Cargando...</div>

    <div id="privateContent" class="private-content hidden">
        <h2 class="message">Nuestro rincón</h2>
        
        <p class="text-info">
            Sesión iniciada como 
            <span id="userEmailDisplay" class="highlight"></span>
        </p>
        
        <section class="counters" aria-label="Tiempo juntos">
            <div class="counter-total">
                <p class="counter-label">Llevamos juntos</p>
                <div class="counter-units">
                    <div><span id="cYears">0</span><small>años</small></div>
                    <div><span id="cMonths">0</span><small>meses</small></div>
                    <div><span id="cDays">0</span><small>días</small></div>
                </div>
            </div>
            <div class="counter-month">
                <p class="counter-label">Faltan para nuestro próximo mes</p>
                <div class="counter-units counter-countdown">
                    <div><span id="cHours">0</span><small>horas</small></div>
                    <div><span id="cMin">00</span><small>minutos</small></div>
                    <div><span id="cSec">00</span><small>segundos</small></div>
                </div>
                <div class="counter-bar"><i id="cBar"></i></div>
                <p id="cNote" class="counter-note"></p>
            </div>
        </section>
        <a href="diario.html" class="nav-btn view-btn">Abrir nuestro diario</a>
        <button id="logoutBtn" class="logout-button">Cerrar Sesión</button>
    </div>

    <script type="module" src="scripts.js"></script>
    <script src="counter.js" defer></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>
</body>
</html>
